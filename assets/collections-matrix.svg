<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
  <title id="t">Strings, lists and tuples compared</title>
  <desc id="d">Capability matrix: all three are ordered, indexable and allow duplicates; only lists are mutable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .row{animation:in .6s ease both}
    @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
    .r1{animation-delay:.2s}.r2{animation-delay:.5s}.r3{animation-delay:.8s}.r4{animation-delay:1.1s}.r5{animation-delay:1.4s}
    .pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  </style>
  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="24" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="13" letter-spacing="2" fill="#6c7280">DATA STRUCTURES · CAPABILITY MATRIX</text>

  <!-- column heads -->
  <g class="mono" text-anchor="middle">
    <rect x="620" y="80" width="280" height="90" rx="14" fill="#4dabf7" fill-opacity=".15" stroke="#4dabf7"/>
    <text x="760" y="118" font-size="26" font-weight="700" fill="#fff">str</text><text x="760" y="148" font-size="22" fill="#4dabf7">"text"</text>
    <rect x="920" y="80" width="280" height="90" rx="14" fill="#d97757" fill-opacity=".15" stroke="#d97757"/>
    <text x="1060" y="118" font-size="26" font-weight="700" fill="#fff">list</text><text x="1060" y="148" font-size="22" fill="#d97757">[ 1, 2, 3 ]</text>
    <rect x="1220" y="80" width="280" height="90" rx="14" fill="#6c5ce7" fill-opacity=".15" stroke="#6c5ce7"/>
    <text x="1360" y="118" font-size="26" font-weight="700" fill="#fff">tuple</text><text x="1360" y="148" font-size="22" fill="#a89cf5">( 1, 2, 3 )</text>
  </g>

  <!-- rows -->
  <g class="sans" font-size="22" fill="#e6dfda">
    <g class="row r1"><rect x="40" y="190" width="1460" height="64" rx="12" fill="#14161d" stroke="#2a2d36"/><text x="68" y="231">Ordered</text></g>
    <g class="row r2"><rect x="40" y="266" width="1460" height="64" rx="12" fill="#14161d" stroke="#2a2d36"/><text x="68" y="307">Indexing and slicing</text></g>
    <g class="row r3"><rect x="40" y="342" width="1460" height="64" rx="12" fill="#14161d" stroke="#2a2d36"/><text x="68" y="383">Allows duplicates</text></g>
    <g class="row r4"><rect x="40" y="418" width="1460" height="64" rx="12" fill="#14161d" stroke="#2a2d36"/><text x="68" y="459">Mutable (change in place)</text></g>
    <g class="row r5"><text x="68" y="523" fill="#9a948f" font-size="16">Best for</text></g>
  </g>

  <!-- ticks: green circle with check -->
  <g stroke="#0b0d12" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="row r1"><circle cx="760" cy="222" r="17" fill="#3ddc97" stroke="none"/><path d="M752 222 l6 6 l11 -12"/><circle cx="1060" cy="222" r="17" fill="#3ddc97" stroke="none"/><path d="M1052 222 l6 6 l11 -12"/><circle cx="1360" cy="222" r="17" fill="#3ddc97" stroke="none"/><path d="M1352 222 l6 6 l11 -12"/></g>
    <g class="row r2"><circle cx="760" cy="298" r="17" fill="#3ddc97" stroke="none"/><path d="M752 298 l6 6 l11 -12"/><circle cx="1060" cy="298" r="17" fill="#3ddc97" stroke="none"/><path d="M1052 298 l6 6 l11 -12"/><circle cx="1360" cy="298" r="17" fill="#3ddc97" stroke="none"/><path d="M1352 298 l6 6 l11 -12"/></g>
    <g class="row r3"><circle cx="760" cy="374" r="17" fill="#3ddc97" stroke="none"/><path d="M752 374 l6 6 l11 -12"/><circle cx="1060" cy="374" r="17" fill="#3ddc97" stroke="none"/><path d="M1052 374 l6 6 l11 -12"/><circle cx="1360" cy="374" r="17" fill="#3ddc97" stroke="none"/><path d="M1352 374 l6 6 l11 -12"/></g>
    <g class="row r4">
      <circle cx="760" cy="450" r="17" fill="#ff4d8d" stroke="none"/><path d="M752 442 l16 16 M768 442 l-16 16" stroke="#0b0d12"/>
      <g class="pop"><circle cx="1060" cy="450" r="17" fill="#3ddc97" stroke="none"/></g><path d="M1052 450 l6 6 l11 -12"/>
      <circle cx="1360" cy="450" r="17" fill="#ff4d8d" stroke="none"/><path d="M1352 442 l16 16 M1368 442 l-16 16"/>
    </g>
  </g>
  <g class="row r5 sans" font-size="17" text-anchor="middle" fill="#c9c2bd">
    <text x="760" y="523">Text &amp; messages</text><text x="1060" y="523">Changing collections</text><text x="1360" y="523">Fixed records</text>
  </g>
</svg>
