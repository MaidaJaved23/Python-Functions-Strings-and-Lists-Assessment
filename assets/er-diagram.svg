<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="t d">
  <title id="t">Student data ER diagram</title>
  <desc id="d">Entity relationship diagram: a student has many marks and expenses and bills; a subject has many marks; a bill has many bill items.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <marker id="one" viewBox="-30 -12 40 24" refX="0" refY="0" markerWidth="40" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M-14 -10 V10 M-22 -10 V10" stroke="#c9c2bd" stroke-width="2.5" fill="none"/>
    </marker>
    <marker id="many" viewBox="-30 -12 40 24" refX="0" refY="0" markerWidth="40" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto" overflow="visible">
      <path d="M-18 -10 L0 0 M-18 10 L0 0 M-18 0 H0" stroke="#c9c2bd" stroke-width="2.5" fill="none"/>
    </marker>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .rel{fill:none;stroke:#c9c2bd;stroke-width:2.5;stroke-dasharray:9 7;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    .ent{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .e1{animation-delay:.1s}.e2{animation-delay:.3s}.e3{animation-delay:.5s}.e4{animation-delay:.7s}.e5{animation-delay:.9s}.e6{animation-delay:1.1s}
    .nm{font-size:15px;fill:#f2e9e4}
    .ty{font-size:13px;fill:#6c7280}
    .pk{font-size:11px;font-weight:700;fill:#1a0c07}
    .fk{font-size:11px;font-weight:700;fill:#fff}
    .rl{font-size:13px;fill:#9a948f}
  </style>
  <rect width="1600" height="780" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="780" rx="24" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="13" letter-spacing="2" fill="#6c7280">ER DIAGRAM · DATA BEHIND THE PRACTICE CHALLENGES</text>
  <text x="40" y="82" class="sans" font-size="16" fill="#9a948f">Crow's foot notation · one (||) to many (&lt;)</text>

  <!-- relationships -->
  <path class="rel" d="M400 229 H640" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M1200 195 H960" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M1360 280 V440" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M1240 280 V362 H800 V440" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M640 530 H400" marker-start="url(#one)" marker-end="url(#many)"/>
  <g class="rl sans" text-anchor="middle">
    <text x="520" y="214">has</text>
    <text x="1080" y="180">earns</text>
    <text x="1395" y="365">records</text>
    <text x="1020" y="350">receives</text>
    <text x="520" y="515">lists</text>
  </g>

  <!-- SUBJECT -->
  <g class="ent e1" filter="url(#sh)">
    <rect x="80" y="100" width="320" height="146" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M80 144 V114 a14 14 0 0 1 14 -14 H386 a14 14 0 0 1 14 14 V144 Z" fill="#d97757"/>
    <text x="100" y="129" class="mono" font-size="16" font-weight="700" fill="#1a0c07">SUBJECT</text>
    <rect x="92" y="151" width="34" height="20" rx="5" fill="#d97757"/><text x="109" y="165" class="mono pk" text-anchor="middle">PK</text>
    <text x="140" y="166" class="mono nm">subject_id</text><text x="388" y="166" class="mono ty" text-anchor="end">int</text>
    <text x="140" y="200" class="mono nm">name</text><text x="388" y="200" class="mono ty" text-anchor="end">str</text>
    <text x="140" y="234" class="mono nm">total_marks</text><text x="388" y="234" class="mono ty" text-anchor="end">int</text>
  </g>

  <!-- MARK -->
  <g class="ent e2" filter="url(#sh)">
    <rect x="640" y="100" width="320" height="180" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M640 144 V114 a14 14 0 0 1 14 -14 H946 a14 14 0 0 1 14 14 V144 Z" fill="#3ddc97"/>
    <text x="660" y="129" class="mono" font-size="16" font-weight="700" fill="#06210f">MARK</text>
    <rect x="652" y="151" width="34" height="20" rx="5" fill="#d97757"/><text x="669" y="165" class="mono pk" text-anchor="middle">PK</text>
    <text x="700" y="166" class="mono nm">mark_id</text><text x="948" y="166" class="mono ty" text-anchor="end">int</text>
    <rect x="652" y="185" width="34" height="20" rx="5" fill="#6c5ce7"/><text x="669" y="199" class="mono fk" text-anchor="middle">FK</text>
    <text x="700" y="200" class="mono nm">student_id</text><text x="948" y="200" class="mono ty" text-anchor="end">int</text>
    <rect x="652" y="219" width="34" height="20" rx="5" fill="#6c5ce7"/><text x="669" y="233" class="mono fk" text-anchor="middle">FK</text>
    <text x="700" y="234" class="mono nm">subject_id</text><text x="948" y="234" class="mono ty" text-anchor="end">int</text>
    <text x="700" y="268" class="mono nm">score</text><text x="948" y="268" class="mono ty" text-anchor="end">int</text>
  </g>

  <!-- STUDENT -->
  <g class="ent e3" filter="url(#sh)">
    <rect x="1200" y="100" width="320" height="180" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M1200 144 V114 a14 14 0 0 1 14 -14 H1506 a14 14 0 0 1 14 14 V144 Z" fill="#ff4d8d"/>
    <text x="1220" y="129" class="mono" font-size="16" font-weight="700" fill="#2b0614">STUDENT</text>
    <rect x="1212" y="151" width="34" height="20" rx="5" fill="#d97757"/><text x="1229" y="165" class="mono pk" text-anchor="middle">PK</text>
    <text x="1260" y="166" class="mono nm">student_id</text><text x="1508" y="166" class="mono ty" text-anchor="end">int</text>
    <text x="1260" y="200" class="mono nm">full_name</text><text x="1508" y="200" class="mono ty" text-anchor="end">str</text>
    <text x="1260" y="234" class="mono nm">email</text><text x="1508" y="234" class="mono ty" text-anchor="end">str</text>
    <text x="1260" y="268" class="mono nm">phone</text><text x="1508" y="268" class="mono ty" text-anchor="end">str</text>
  </g>

  <!-- BILL_ITEM -->
  <g class="ent e4" filter="url(#sh)">
    <rect x="80" y="440" width="320" height="214" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M80 484 V454 a14 14 0 0 1 14 -14 H386 a14 14 0 0 1 14 14 V484 Z" fill="#4dabf7"/>
    <text x="100" y="469" class="mono" font-size="16" font-weight="700" fill="#041a2b">BILL_ITEM</text>
    <rect x="92" y="491" width="34" height="20" rx="5" fill="#d97757"/><text x="109" y="505" class="mono pk" text-anchor="middle">PK</text>
    <text x="140" y="506" class="mono nm">item_id</text><text x="388" y="506" class="mono ty" text-anchor="end">int</text>
    <rect x="92" y="525" width="34" height="20" rx="5" fill="#6c5ce7"/><text x="109" y="539" class="mono fk" text-anchor="middle">FK</text>
    <text x="140" y="540" class="mono nm">bill_id</text><text x="388" y="540" class="mono ty" text-anchor="end">int</text>
    <text x="140" y="574" class="mono nm">name</text><text x="388" y="574" class="mono ty" text-anchor="end">str</text>
    <text x="140" y="608" class="mono nm">price</text><text x="388" y="608" class="mono ty" text-anchor="end">float</text>
    <text x="140" y="642" class="mono nm">qty</text><text x="388" y="642" class="mono ty" text-anchor="end">int</text>
  </g>

  <!-- BILL -->
  <g class="ent e5" filter="url(#sh)">
    <rect x="640" y="440" width="320" height="146" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M640 484 V454 a14 14 0 0 1 14 -14 H946 a14 14 0 0 1 14 14 V484 Z" fill="#6c5ce7"/>
    <text x="660" y="469" class="mono" font-size="16" font-weight="700" fill="#ffffff">BILL</text>
    <rect x="652" y="491" width="34" height="20" rx="5" fill="#d97757"/><text x="669" y="505" class="mono pk" text-anchor="middle">PK</text>
    <text x="700" y="506" class="mono nm">bill_id</text><text x="948" y="506" class="mono ty" text-anchor="end">int</text>
    <rect x="652" y="525" width="34" height="20" rx="5" fill="#6c5ce7"/><text x="669" y="539" class="mono fk" text-anchor="middle">FK</text>
    <text x="700" y="540" class="mono nm">student_id</text><text x="948" y="540" class="mono ty" text-anchor="end">int</text>
    <text x="700" y="574" class="mono nm">discount_pct</text><text x="948" y="574" class="mono ty" text-anchor="end">int (10)</text>
  </g>

  <!-- EXPENSE -->
  <g class="ent e6" filter="url(#sh)">
    <rect x="1200" y="440" width="320" height="180" rx="14" fill="#14161d" stroke="#2a2d36"/>
    <path d="M1200 484 V454 a14 14 0 0 1 14 -14 H1506 a14 14 0 0 1 14 14 V484 Z" fill="#ffb454"/>
    <text x="1220" y="469" class="mono" font-size="16" font-weight="700" fill="#2b1a04">EXPENSE</text>
    <rect x="1212" y="491" width="34" height="20" rx="5" fill="#d97757"/><text x="1229" y="505" class="mono pk" text-anchor="middle">PK</text>
    <text x="1260" y="506" class="mono nm">expense_id</text><text x="1508" y="506" class="mono ty" text-anchor="end">int</text>
    <rect x="1212" y="525" width="34" height="20" rx="5" fill="#6c5ce7"/><text x="1229" y="539" class="mono fk" text-anchor="middle">FK</text>
    <text x="1260" y="540" class="mono nm">student_id</text><text x="1508" y="540" class="mono ty" text-anchor="end">int</text>
    <text x="1260" y="574" class="mono nm">label</text><text x="1508" y="574" class="mono ty" text-anchor="end">str</text>
    <text x="1260" y="608" class="mono nm">amount</text><text x="1508" y="608" class="mono ty" text-anchor="end">float</text>
  </g>

  <!-- tuple note -->
  <rect x="80" y="694" width="1440" height="58" rx="12" fill="#d97757" fill-opacity=".1" stroke="#d97757" stroke-opacity=".6"/>
  <text x="104" y="729" class="mono" font-size="15" fill="#f2e9e4"><tspan fill="#d97757" font-weight="700">In Python, one tuple = one row:</tspan>  students = [(1, "Ayesha Khan", "ayesha@example.com", "+92 300 1234567"), ...]</text>
</svg>
