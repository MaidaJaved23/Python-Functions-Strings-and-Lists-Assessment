<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" width="1600" height="260" role="img" aria-labelledby="t d">
  <title id="t">PSEB DEPLOY Python, Django and AI Bootcamp footer</title>
  <desc id="d">Animated footer with a scrolling keyword ticker, flowing waves and instructor credit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241512"/>
      <stop offset="0.5" stop-color="#14161d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="0.55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0d12" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#0b0d12" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#0b0d12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0d12" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip"><rect width="1600" height="260" rx="28"/></clipPath>
    <clipPath id="tickerClip"><rect x="0" y="28" width="1600" height="44"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .w1{animation:drift 16s linear infinite}
    .w2{animation:drift 26s linear infinite reverse}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-800px)}}
    .ticker{animation:scroll 30s linear infinite}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
    .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.3}}
    .shine{animation:shine 4s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-200px);opacity:0}40%{opacity:1}100%{transform:translateX(1700px);opacity:0}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1600" height="260" fill="url(#bg)"/>
    <rect width="1600" height="260" fill="url(#grid)"/>

    <!-- waves -->
    <g class="w2"><path d="M0 120 Q 200 80 400 120 T 800 120 T 1200 120 T 1600 120 T 2000 120 T 2400 120 V 260 H 0 Z" fill="url(#w2)"/></g>
    <g class="w1"><path d="M0 150 Q 200 112 400 150 T 800 150 T 1200 150 T 1600 150 T 2000 150 T 2400 150 V 260 H 0 Z" fill="url(#w1)"/></g>

    <!-- ticker -->
    <g clip-path="url(#tickerClip)">
      <g class="ticker mono" font-size="17" font-weight="600">
        <text x="40" y="57" fill="#d97757">def</text>
        <text x="110" y="57" fill="#8b8f9a">·</text>
        <text x="140" y="57" fill="#ff4d8d">return</text>
        <text x="250" y="57" fill="#8b8f9a">·</text>
        <text x="280" y="57" fill="#6c5ce7">*args</text>
        <text x="370" y="57" fill="#8b8f9a">·</text>
        <text x="400" y="57" fill="#3ddc97">**kwargs</text>
        <text x="520" y="57" fill="#8b8f9a">·</text>
        <text x="550" y="57" fill="#4dabf7">str[1:4]</text>
        <text x="660" y="57" fill="#8b8f9a">·</text>
        <text x="690" y="57" fill="#d97757">list.append()</text>
        <text x="850" y="57" fill="#8b8f9a">·</text>
        <text x="880" y="57" fill="#ff4d8d">tuple unpacking</text>
        <text x="1060" y="57" fill="#8b8f9a">·</text>
        <text x="1090" y="57" fill="#6c5ce7">f-strings</text>
        <!-- repeat for seamless loop -->
        <text x="1240" y="57" fill="#d97757">def</text>
        <text x="1310" y="57" fill="#8b8f9a">·</text>
        <text x="1340" y="57" fill="#ff4d8d">return</text>
        <text x="1450" y="57" fill="#8b8f9a">·</text>
        <text x="1480" y="57" fill="#6c5ce7">*args</text>
        <text x="1570" y="57" fill="#8b8f9a">·</text>
        <text x="1600" y="57" fill="#3ddc97">**kwargs</text>
        <text x="1720" y="57" fill="#8b8f9a">·</text>
        <text x="1750" y="57" fill="#4dabf7">str[1:4]</text>
        <text x="1860" y="57" fill="#8b8f9a">·</text>
        <text x="1890" y="57" fill="#d97757">list.append()</text>
        <text x="2050" y="57" fill="#8b8f9a">·</text>
        <text x="2080" y="57" fill="#ff4d8d">tuple unpacking</text>
        <text x="2260" y="57" fill="#8b8f9a">·</text>
        <text x="2290" y="57" fill="#6c5ce7">f-strings</text>
      </g>
    </g>
    <rect x="0" y="28" width="1600" height="44" fill="url(#fade)"/>
    <line x1="60" y1="84" x2="1540" y2="84" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect class="shine" x="0" y="82" width="140" height="3" fill="url(#accent)"/>

    <!-- credit -->
    <g>
      <circle class="pulse" cx="84" cy="150" r="6" fill="#3ddc97"/>
      <text x="108" y="156" class="sans" font-size="15" font-weight="600" fill="#b9b2ad" letter-spacing="2">NOW TEACHING</text>
      <text x="80" y="204" class="sans" font-size="32" font-weight="800" fill="url(#accent)">PSEB DEPLOY: Python, Django &amp; AI Bootcamp</text>
      <text x="80" y="238" class="sans" font-size="18" fill="#9a948f">Instructor · Waleed Shehbaz · github.com/waleedshehbazdev</text>
    </g>

    <!-- badge right -->
    <g class="bob">
      <rect x="1230" y="136" width="290" height="84" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#d97757" stroke-opacity="0.5"/>
      <text x="1255" y="170" class="mono" font-size="15" fill="#8b8f9a">next up</text>
      <text x="1255" y="202" class="mono" font-size="22" font-weight="700" fill="#ffffff">OOP → Django → AI</text>
    </g>
  </g>
</svg>
