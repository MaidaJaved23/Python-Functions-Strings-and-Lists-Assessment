<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-labelledby="t d">
  <title id="t">How a function call works</title>
  <desc id="d">Arguments 250 and 3 travel from the caller into calculate_total, which returns 750 back to the variable bill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c9c2bd"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="p1" d="M470 190 C560 190 560 190 650 190"/>
    <path id="p2" d="M470 230 C560 230 560 230 650 230"/>
    <path id="p3" d="M950 300 C1020 360 1020 360 1090 300"/>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .flow{fill:none;stroke:#c9c2bd;stroke-width:2;stroke-dasharray:8 7;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-30}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  </style>
  <rect width="1600" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="480" rx="24" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="13" letter-spacing="2" fill="#6c7280">FUNCTION CALL · STEP BY STEP</text>

  <!-- caller -->
  <rect x="60" y="120" width="410" height="200" rx="16" fill="#14161d" stroke="#2a2d36"/>
  <text x="84" y="156" class="mono" font-size="13" letter-spacing="2" fill="#d97757">1 · CALLER</text>
  <text x="84" y="210" class="mono" font-size="20" fill="#f2e9e4"><tspan fill="#8b8f9a">bill = </tspan>calculate_total(<tspan fill="#3ddc97">250</tspan>, <tspan fill="#3ddc97">3</tspan>)</text>
  <text x="84" y="260" class="mono" font-size="16" fill="#8b8f9a">arguments: 250, 3</text>
  <text x="84" y="290" class="mono" font-size="16" fill="#8b8f9a">waiting for a value…</text>

  <!-- function -->
  <rect x="650" y="90" width="300" height="260" rx="16" fill="#1b1410" stroke="#d97757" stroke-width="2"/>
  <rect class="pulse" x="650" y="90" width="300" height="260" rx="16" fill="none" stroke="#d97757" stroke-width="3"/>
  <text x="674" y="126" class="mono" font-size="13" letter-spacing="2" fill="#d97757">2 · FUNCTION</text>
  <text x="674" y="168" class="mono" font-size="17" fill="#f2e9e4"><tspan fill="#ff4d8d">def</tspan> calculate_total(</text>
  <text x="674" y="196" class="mono" font-size="17" fill="#4dabf7">   price, quantity):</text>
  <rect x="674" y="222" width="252" height="62" rx="10" fill="#0b0d12" stroke="#2a2d36"/>
  <text x="690" y="249" class="mono" font-size="14" fill="#8b8f9a">local scope</text>
  <text x="690" y="272" class="mono" font-size="17" fill="#f2e9e4">250 × 3 = <tspan fill="#3ddc97">750</tspan></text>
  <text x="674" y="318" class="mono" font-size="17"><tspan fill="#ff4d8d">return</tspan><tspan fill="#f2e9e4"> price * quantity</tspan></text>

  <!-- result -->
  <rect x="1090" y="120" width="450" height="200" rx="16" fill="#14161d" stroke="#2a2d36"/>
  <text x="1114" y="156" class="mono" font-size="13" letter-spacing="2" fill="#3ddc97">3 · RESULT STORED</text>
  <text x="1114" y="214" class="mono" font-size="22" fill="#f2e9e4">bill <tspan fill="#8b8f9a">=</tspan> <tspan fill="#3ddc97" font-weight="700">750</tspan></text>
  <text x="1114" y="262" class="mono" font-size="16" fill="#8b8f9a">reusable · testable · printable</text>
  <text x="1114" y="292" class="mono" font-size="16" fill="#d97757">print(bill)  →  750</text>

  <!-- connectors -->
  <path class="flow" d="M470 190 H650" marker-end="url(#ar)"/>
  <path class="flow" d="M470 230 H650" marker-end="url(#ar)"/>
  <path class="flow" d="M950 200 H1090" marker-end="url(#ar)"/>
  <text x="560" y="170" class="mono" font-size="14" fill="#c9c2bd" text-anchor="middle">price</text>
  <text x="560" y="262" class="mono" font-size="14" fill="#c9c2bd" text-anchor="middle">quantity</text>
  <text x="1020" y="180" class="mono" font-size="14" fill="#c9c2bd" text-anchor="middle">return</text>

  <!-- moving packets -->
  <g filter="url(#glow)">
    <circle r="11" fill="#3ddc97"><animateMotion dur="3s" repeatCount="indefinite" path="M470 190 H650"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#4dabf7"><animateMotion dur="3s" begin=".25s" repeatCount="indefinite" path="M470 230 H650"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="3s" begin=".25s" repeatCount="indefinite"/></circle>
    <circle r="13" fill="#d97757"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M950 200 H1090"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <g class="sans" font-size="13" fill="#6c7280">
    <text x="60" y="400">Arguments go in through parameters. The return value comes back to the caller.</text>
    <text x="60" y="424">Variables created inside the function live only in its local scope.</text>
  </g>
</svg>
