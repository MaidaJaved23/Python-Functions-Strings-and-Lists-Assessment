<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Grading scale chart"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04101a"/><stop offset=".55" stop-color="#08283a"/><stop offset="1" stop-color="#06303a"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<radialGradient id="globe" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#0e5a7a"/><stop offset=".6" stop-color="#0a3150"/><stop offset="1" stop-color="#051a2b"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="560" rx="18" fill="url(#bg)" stroke="#22d3ee" stroke-opacity=".3"/><text x="60" y="56" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#e6f6ff">Grading scale</text><text x="60" y="86" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8fb3c7">Letter grade comes from the overall percentage</text><line x1="260.0" x2="260.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="260.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">0%</text><line x1="338.0" x2="338.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="338.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">10%</text><line x1="416.0" x2="416.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="416.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">20%</text><line x1="494.0" x2="494.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="494.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">30%</text><line x1="572.0" x2="572.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="572.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">40%</text><line x1="650.0" x2="650.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="650.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">50%</text><line x1="728.0" x2="728.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="728.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">60%</text><line x1="806.0" x2="806.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="806.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">70%</text><line x1="884.0" x2="884.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="884.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">80%</text><line x1="962.0" x2="962.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="962.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">90%</text><line x1="1040.0" x2="1040.0" y1="115" y2="440" stroke="#22d3ee" stroke-opacity=".1"/><text x="1040.0" y="462" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="14" fill="#8fb3c7">100%</text><text x="60" y="152" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#f87171">Fail</text><text x="130" y="151" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">Below 50</text><rect x="260.0" y="125" width="0" height="38" rx="8" fill="#f87171" filter="url(#glow)"><animate attributeName="width" from="0" to="390.0" dur="1s" begin="0.0s" fill="freeze"/></rect><text x="60" y="204" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fbbf24">D</text><text x="130" y="203" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">50 to below 60</text><rect x="650.0" y="177" width="0" height="38" rx="8" fill="#fbbf24" filter="url(#glow)"><animate attributeName="width" from="0" to="78.0" dur="1s" begin="0.18s" fill="freeze"/></rect><text x="60" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#a3e635">C</text><text x="130" y="255" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">60 to below 70</text><rect x="728.0" y="229" width="0" height="38" rx="8" fill="#a3e635" filter="url(#glow)"><animate attributeName="width" from="0" to="78.0" dur="1s" begin="0.36s" fill="freeze"/></rect><text x="60" y="308" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#34d399">B</text><text x="130" y="307" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">70 to below 80</text><rect x="806.0" y="281" width="0" height="38" rx="8" fill="#34d399" filter="url(#glow)"><animate attributeName="width" from="0" to="78.0" dur="1s" begin="0.54s" fill="freeze"/></rect><text x="60" y="360" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#22d3ee">A</text><text x="130" y="359" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">80 to below 90</text><rect x="884.0" y="333" width="0" height="38" rx="8" fill="#22d3ee" filter="url(#glow)"><animate attributeName="width" from="0" to="78.0" dur="1s" begin="0.72s" fill="freeze"/></rect><text x="60" y="412" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#3b82f6">A+</text><text x="130" y="411" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8fb3c7">90 and above</text><rect x="962.0" y="385" width="0" height="38" rx="8" fill="#3b82f6" filter="url(#glow)"><animate attributeName="width" from="0" to="78.0" dur="1s" begin="0.8999999999999999s" fill="freeze"/></rect><g><rect x="60" y="486" width="980" height="50" rx="10" fill="#0b2433" stroke="#f87171" stroke-width="2"/><text x="80" y="517" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#e6f6ff">Special rule: any one subject below 40 makes Final Status = Fail, even with a high percentage.</text></g></svg>