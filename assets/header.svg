<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-labelledby="t d">
  <title id="t">Python Functions, Strings, Lists and Tuples</title>
  <desc id="d">Animated banner with a code window, floating tokens and flowing waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.6" stop-color="#14161d"/>
      <stop offset="1" stop-color="#241512"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="0.55" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1600" height="440" rx="28"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .float{animation:float 6s ease-in-out infinite}
    .float2{animation:float 8s ease-in-out infinite reverse}
    .float3{animation:float 7s ease-in-out infinite 1s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    .w1{animation:drift 14s linear infinite}
    .w2{animation:drift 22s linear infinite reverse}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-800px)}}
    .l{animation:reveal .6s ease both}
    .l1{animation-delay:.4s}.l2{animation-delay:.9s}.l3{animation-delay:1.4s}.l4{animation-delay:1.9s}.l5{animation-delay:2.4s}
    @keyframes reveal{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.3}}
    .sweep{animation:sweep 5s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-300px);opacity:0}30%{opacity:1}100%{transform:translateX(900px);opacity:0}}
    .title{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1600" height="440" fill="url(#bg)"/>
    <rect width="1600" height="440" fill="url(#grid)"/>
    <circle class="float" cx="1250" cy="120" r="260" fill="url(#orb)"/>
    <circle class="float2" cx="150" cy="380" r="200" fill="url(#orb)" opacity="0.5"/>

    <!-- animated waves -->
    <g class="w2" opacity="0.9">
      <path d="M0 360 Q 200 320 400 360 T 800 360 T 1200 360 T 1600 360 T 2000 360 T 2400 360 V 440 H 0 Z" fill="url(#wave2)"/>
    </g>
    <g class="w1">
      <path d="M0 385 Q 200 350 400 385 T 800 385 T 1200 385 T 1600 385 T 2000 385 T 2400 385 V 440 H 0 Z" fill="url(#wave1)"/>
    </g>

    <!-- badge -->
    <g class="title" style="animation-delay:.1s">
      <rect x="80" y="62" width="330" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#d97757" stroke-opacity="0.6"/>
      <circle class="pulse" cx="104" cy="80" r="5" fill="#3ddc97"/>
      <text x="124" y="85" class="sans" font-size="14" font-weight="600" fill="#f2e9e4" letter-spacing="1.6">PSEB DEPLOY · PYTHON BOOTCAMP</text>
    </g>

    <!-- title -->
    <g class="title" style="animation-delay:.3s">
      <text x="80" y="168" class="sans" font-size="58" font-weight="800" fill="#ffffff">Python Functions,</text>
      <text x="80" y="236" class="sans" font-size="58" font-weight="800" fill="url(#accent)">Strings, Lists &amp; Tuples</text>
    </g>
    <g class="title" style="animation-delay:.6s">
      <text x="80" y="284" class="sans" font-size="21" fill="#b9b2ad">Reusable code, text processing and core data structures,</text>
      <text x="80" y="314" class="sans" font-size="21" fill="#b9b2ad">the foundation for OOP, Django, REST APIs and AI apps.</text>
    </g>
    <rect x="80" y="338" width="220" height="5" rx="2.5" fill="url(#accent)"/>
    <rect class="sweep" x="80" y="338" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>

    <!-- code window -->
    <g class="float3">
      <rect x="930" y="70" width="560" height="300" rx="18" fill="#0f1116" stroke="#2a2d36" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="930" y="70" width="560" height="44" rx="18" fill="#1a1d25"/>
      <rect x="930" y="96" width="560" height="18" fill="#1a1d25"/>
      <circle cx="958" cy="92" r="7" fill="#ff5f56"/>
      <circle cx="982" cy="92" r="7" fill="#ffbd2e"/>
      <circle cx="1006" cy="92" r="7" fill="#27c93f"/>
      <text x="1210" y="97" class="mono" font-size="13" fill="#8b8f9a" text-anchor="middle">01_functions_fundamentals.py</text>

      <g class="mono" font-size="19">
        <text class="l l1" x="960" y="156"><tspan fill="#ff4d8d">def</tspan><tspan fill="#f2e9e4"> calculate_total(</tspan><tspan fill="#4dabf7">price</tspan><tspan fill="#f2e9e4">, </tspan><tspan fill="#4dabf7">qty</tspan><tspan fill="#f2e9e4">):</tspan></text>
        <text class="l l2" x="990" y="192"><tspan fill="#ff4d8d">return</tspan><tspan fill="#f2e9e4"> price * qty</tspan></text>
        <text class="l l3" x="960" y="240"><tspan fill="#f2e9e4">bill = calculate_total(</tspan><tspan fill="#3ddc97">250</tspan><tspan fill="#f2e9e4">, </tspan><tspan fill="#3ddc97">3</tspan><tspan fill="#f2e9e4">)</tspan></text>
        <text class="l l4" x="960" y="276"><tspan fill="#d97757">print</tspan><tspan fill="#f2e9e4">(bill)</tspan></text>
        <text class="l l5" x="960" y="322"><tspan fill="#6c7280"># output</tspan></text>
        <text class="l l5" x="960" y="350"><tspan fill="#3ddc97">750</tspan><tspan class="cursor" fill="#d97757"> ▌</tspan></text>
      </g>
    </g>

    <!-- floating tokens -->
    <g class="mono" font-weight="700">
      <g class="float" ><text x="640" y="110" font-size="30" fill="#d97757" opacity="0.85">[ ]</text></g>
      <g class="float2"><text x="800" y="205" font-size="30" fill="#ff4d8d" opacity="0.8">( )</text></g>
      <g class="float3"><text x="830" y="275" font-size="28" fill="#6c5ce7" opacity="0.9">" "</text></g>
      <g class="float2"><text x="770" y="345" font-size="26" fill="#3ddc97" opacity="0.8">*args</text></g>
      <g class="float"><text x="780" y="90" font-size="24" fill="#4dabf7" opacity="0.85">f"{}"</text></g>
    </g>
  </g>
</svg>
