<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-labelledby="t d">
  <title id="t">Learning path</title>
  <desc id="d">Flow diagram from the four core topics through practice, GitHub submission and on to OOP, Django, REST APIs and AI apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c9c2bd"/></marker>
    <marker id="ard" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#8b8f9a"/></marker>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .eyebrow{font-size:12px;letter-spacing:2px;font-weight:600}
    .name{font-size:22px;font-weight:700}
    .flow{fill:none;stroke:#c9c2bd;stroke-width:2;stroke-dasharray:8 7;animation:dash 1.4s linear infinite}
    .flowd{fill:none;stroke:#8b8f9a;stroke-width:2;stroke-dasharray:3 6;animation:dash 2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-30}}
    .card{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}.d6{animation-delay:1.1s}.d7{animation-delay:1.3s}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
  </style>
  <rect width="1600" height="840" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="840" rx="24" fill="url(#grid)"/>

  <!-- row labels -->
  <g class="mono" font-size="13" fill="#6c7280" letter-spacing="2">
    <text x="40" y="44">1 · START ANYWHERE</text>
    <text x="40" y="266">2</text>
    <text x="40" y="426">3</text>
    <text x="40" y="586">4</text>
    <text x="40" y="726">5</text>
  </g>

  <!-- connectors -->
  <g>
    <path class="flow" d="M230 140 V230" marker-end="url(#ar)"/>
    <path class="flow" d="M600 140 V230" marker-end="url(#ar)"/>
    <path class="flow" d="M970 140 V230" marker-end="url(#ar)"/>
    <path class="flow" d="M1340 140 V230" marker-end="url(#ar)"/>
    <path class="flow" d="M230 300 C230 350 415 340 415 390" marker-end="url(#ar)"/>
    <path class="flow" d="M600 300 C600 350 415 340 415 390" marker-end="url(#ar)"/>
    <path class="flow" d="M970 300 C970 350 1155 340 1155 390" marker-end="url(#ar)"/>
    <path class="flow" d="M1340 300 C1340 350 1155 340 1155 390" marker-end="url(#ar)"/>
    <path class="flow" d="M415 460 C415 510 600 500 600 550" marker-end="url(#ar)"/>
    <path class="flow" d="M1155 460 C1155 510 970 500 970 550" marker-end="url(#ar)"/>
    <path class="flow" d="M770 585 H800" marker-end="url(#ar)"/>
    <path class="flow" d="M970 620 C970 650 600 650 600 690" marker-end="url(#ar)"/>
    <path class="flowd" d="M230 140 C60 300 60 560 430 585" marker-end="url(#ard)"/>
    <path class="flowd" d="M1340 140 C1560 300 1560 560 1140 585" marker-end="url(#ard)"/>
  </g>

  <!-- row 1: coral -->
  <g class="card d1" filter="url(#sh)"><rect x="60" y="70" width="340" height="70" rx="12" fill="#d97757"/>
    <text x="82" y="97" class="sans eyebrow" fill="#3a1a10">TOPIC 01</text><text x="82" y="125" class="sans name" fill="#1a0c07">Functions</text></g>
  <g class="card d2" filter="url(#sh)"><rect x="430" y="70" width="340" height="70" rx="12" fill="#d97757"/>
    <text x="452" y="97" class="sans eyebrow" fill="#3a1a10">TOPIC 02</text><text x="452" y="125" class="sans name" fill="#1a0c07">Strings</text></g>
  <g class="card d3" filter="url(#sh)"><rect x="800" y="70" width="340" height="70" rx="12" fill="#d97757"/>
    <text x="822" y="97" class="sans eyebrow" fill="#3a1a10">TOPIC 03</text><text x="822" y="125" class="sans name" fill="#1a0c07">Lists</text></g>
  <g class="card d4" filter="url(#sh)"><rect x="1170" y="70" width="340" height="70" rx="12" fill="#d97757"/>
    <text x="1192" y="97" class="sans eyebrow" fill="#3a1a10">TOPIC 04</text><text x="1192" y="125" class="sans name" fill="#1a0c07">Tuples</text></g>

  <!-- row 2: dark -->
  <g class="card d2" filter="url(#sh)"><rect x="60" y="230" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="82" y="257" class="sans eyebrow" fill="#8b8f9a">CORE IDEA</text><text x="82" y="285" class="sans name" fill="#fff">Parameters &amp; return</text></g>
  <g class="card d3" filter="url(#sh)"><rect x="430" y="230" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="452" y="257" class="sans eyebrow" fill="#8b8f9a">CORE IDEA</text><text x="452" y="285" class="sans name" fill="#fff">Indexing &amp; slicing</text></g>
  <g class="card d4" filter="url(#sh)"><rect x="800" y="230" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="822" y="257" class="sans eyebrow" fill="#8b8f9a">CORE IDEA</text><text x="822" y="285" class="sans name" fill="#fff">Methods &amp; comprehension</text></g>
  <g class="card d5" filter="url(#sh)"><rect x="1170" y="230" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="1192" y="257" class="sans eyebrow" fill="#8b8f9a">CORE IDEA</text><text x="1192" y="285" class="sans name" fill="#fff">Unpacking &amp; records</text></g>

  <!-- row 3 -->
  <g class="card d4" filter="url(#sh)"><rect x="245" y="390" width="340" height="70" rx="12" fill="#14161d" stroke="#6c5ce7"/>
    <rect class="glow" x="245" y="390" width="340" height="70" rx="12" fill="none" stroke="#6c5ce7" stroke-width="2"/>
    <text x="267" y="417" class="sans eyebrow" fill="#a89cf5">DESIGN</text><text x="267" y="445" class="sans name" fill="#fff">Reusable function design</text></g>
  <g class="card d5" filter="url(#sh)"><rect x="985" y="390" width="340" height="70" rx="12" fill="#14161d" stroke="#6c5ce7"/>
    <rect class="glow" x="985" y="390" width="340" height="70" rx="12" fill="none" stroke="#6c5ce7" stroke-width="2"/>
    <text x="1007" y="417" class="sans eyebrow" fill="#a89cf5">DESIGN</text><text x="1007" y="445" class="sans name" fill="#fff">Choose the right collection</text></g>

  <!-- row 4 -->
  <g class="card d6" filter="url(#sh)"><rect x="430" y="550" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="452" y="577" class="sans eyebrow" fill="#3ddc97">PRACTICE</text><text x="452" y="605" class="sans name" fill="#fff">19 student challenges</text></g>
  <g class="card d6" filter="url(#sh)"><rect x="800" y="550" width="340" height="70" rx="12" fill="#14161d" stroke="#2a2d36"/>
    <text x="822" y="577" class="sans eyebrow" fill="#3ddc97">SUBMIT</text><text x="822" y="605" class="sans name" fill="#fff">Push to GitHub</text></g>

  <!-- row 5 -->
  <g class="card d7" filter="url(#sh)"><rect x="430" y="690" width="900" height="80" rx="14" fill="#d97757" fill-opacity=".12" stroke="#d97757"/>
    <text x="460" y="722" class="sans eyebrow" fill="#d97757">NEXT IN THE BOOTCAMP</text>
    <g class="mono" font-size="20" font-weight="700" fill="#fff">
      <text x="460" y="755">Python OOP</text><text x="660" y="755" fill="#6c7280">→</text>
      <text x="700" y="755">Django</text><text x="840" y="755" fill="#6c7280">→</text>
      <text x="880" y="755">REST APIs</text><text x="1060" y="755" fill="#6c7280">→</text>
      <text x="1100" y="755">AI apps</text>
    </g>
  </g>
</svg>
