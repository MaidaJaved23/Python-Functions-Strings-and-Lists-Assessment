<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d">
  <title id="t">print versus return</title>
  <desc id="d">print displays a value on screen and the value is gone; return hands the value back so it can be stored and reused.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c9c2bd"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .flow{fill:none;stroke:#c9c2bd;stroke-width:2;stroke-dasharray:8 7;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-30}}
    .fade{animation:fade 3s ease-in-out infinite}
    @keyframes fade{0%,40%{opacity:1}80%,100%{opacity:.08}}
    .keep{animation:keep 3s ease-in-out infinite}
    @keyframes keep{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
  </style>
  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>

  <!-- left: print -->
  <rect x="40" y="40" width="720" height="440" rx="20" fill="#14161d" stroke="#2a2d36"/>
  <text x="72" y="86" class="mono" font-size="13" letter-spacing="2" fill="#ff4d8d">print()</text>
  <text x="72" y="124" class="sans" font-size="26" font-weight="700" fill="#fff">Shows it. Then it's gone.</text>
  <rect x="72" y="156" width="270" height="100" rx="12" fill="#0b0d12" stroke="#2a2d36"/>
  <text x="92" y="196" class="mono" font-size="16" fill="#f2e9e4"><tspan fill="#d97757">print</tspan>(price * qty)</text>
  <text x="92" y="228" class="mono" font-size="14" fill="#8b8f9a">inside the function</text>
  <path class="flow" d="M342 206 H440" marker-end="url(#ar)"/>
  <rect x="440" y="156" width="290" height="100" rx="12" fill="#0b0d12" stroke="#3ddc97" stroke-opacity=".5"/>
  <text x="460" y="190" class="mono" font-size="13" fill="#8b8f9a">SCREEN</text>
  <text x="460" y="232" class="mono" font-size="28" fill="#3ddc97" font-weight="700">750</text>
  <rect x="72" y="296" width="658" height="140" rx="12" fill="#0b0d12" stroke="#2a2d36"/>
  <text x="92" y="334" class="mono" font-size="16" fill="#f2e9e4">bill = calculate_total(<tspan fill="#3ddc97">250</tspan>, <tspan fill="#3ddc97">3</tspan>)</text>
  <text class="fade mono" x="92" y="372" font-size="16" fill="#ff4d8d">bill → None</text>
  <text x="92" y="408" class="sans" font-size="14" fill="#9a948f">The value reached the screen but never came back to the caller.</text>
  <circle r="10" fill="#3ddc97" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M342 206 H440"/></circle>

  <!-- right: return -->
  <rect x="840" y="40" width="720" height="440" rx="20" fill="#14161d" stroke="#2a2d36"/>
  <text x="872" y="86" class="mono" font-size="13" letter-spacing="2" fill="#3ddc97">return</text>
  <text x="872" y="124" class="sans" font-size="26" font-weight="700" fill="#fff">Hands it back. Keep it, reuse it.</text>
  <rect x="872" y="156" width="270" height="100" rx="12" fill="#0b0d12" stroke="#2a2d36"/>
  <text x="892" y="196" class="mono" font-size="16" fill="#f2e9e4"><tspan fill="#ff4d8d">return</tspan> price * qty</text>
  <text x="892" y="228" class="mono" font-size="14" fill="#8b8f9a">inside the function</text>
  <path class="flow" d="M1142 206 H1240" marker-end="url(#ar)"/>
  <rect x="1240" y="156" width="290" height="100" rx="12" fill="#0b0d12" stroke="#d97757" stroke-opacity=".6"/>
  <text x="1260" y="190" class="mono" font-size="13" fill="#8b8f9a">CALLER</text>
  <text x="1260" y="232" class="mono" font-size="28" fill="#d97757" font-weight="700">bill = 750</text>
  <rect x="872" y="296" width="658" height="140" rx="12" fill="#0b0d12" stroke="#3ddc97" stroke-width="2"/>
  <rect class="keep" x="872" y="296" width="658" height="140" rx="12" fill="none" stroke="#3ddc97" stroke-width="3"/>
  <text x="892" y="334" class="mono" font-size="16" fill="#f2e9e4">total = bill + <tspan fill="#3ddc97">50</tspan>      <tspan fill="#6c7280"># 800</tspan></text>
  <text x="892" y="368" class="mono" font-size="16" fill="#f2e9e4">assert bill == <tspan fill="#3ddc97">750</tspan>   <tspan fill="#6c7280"># testable</tspan></text>
  <text x="892" y="408" class="sans" font-size="14" fill="#9a948f">The result can be stored, reused, compared and tested.</text>
  <circle r="10" fill="#d97757" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M1142 206 H1240"/></circle>
</svg>
