<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d">
  <title id="t">String indexing and slicing</title>
  <desc id="d">The string PYTHON with positive and negative indexes; the slice s[1:4] highlights YTH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#14161d"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d97757"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
    .out{animation:out 6s ease-in-out infinite}
    @keyframes out{0%,25%{opacity:0;transform:translateY(8px)}40%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  </style>
  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>
  <text x="40" y="52" class="mono" font-size="13" letter-spacing="2" fill="#6c7280">STRINGS · INDEXING &amp; SLICING</text>
  <text x="40" y="96" class="mono" font-size="26" fill="#f2e9e4"><tspan fill="#8b8f9a">s = </tspan><tspan fill="#3ddc97">"PYTHON"</tspan></text>

  <!-- highlight: cells are 150 wide starting x=250; s[1:4] covers cells 1..3 -->
  <rect x="400" y="170" width="450" height="120" rx="16" fill="url(#hl)" fill-opacity=".18" stroke="#d97757" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="250;400;400;250" keyTimes="0;.25;.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="150;450;450;150" keyTimes="0;.25;.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- cells -->
  <g class="mono" text-anchor="middle">
    <rect x="250" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36"/><text x="325" y="250" font-size="64" font-weight="700" fill="#fff">P</text>
    <rect x="400" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36" fill-opacity=".6"/><text x="475" y="250" font-size="64" font-weight="700" fill="#fff">Y</text>
    <rect x="550" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36" fill-opacity=".6"/><text x="625" y="250" font-size="64" font-weight="700" fill="#fff">T</text>
    <rect x="700" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36" fill-opacity=".6"/><text x="775" y="250" font-size="64" font-weight="700" fill="#fff">H</text>
    <rect x="850" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36"/><text x="925" y="250" font-size="64" font-weight="700" fill="#fff">O</text>
    <rect x="1000" y="170" width="150" height="120" rx="14" fill="#14161d" stroke="#2a2d36"/><text x="1075" y="250" font-size="64" font-weight="700" fill="#fff">N</text>
  </g>

  <!-- indexes -->
  <g class="mono" text-anchor="middle" font-size="22">
    <text x="325" y="150" fill="#4dabf7">0</text><text x="475" y="150" fill="#4dabf7">1</text><text x="625" y="150" fill="#4dabf7">2</text>
    <text x="775" y="150" fill="#4dabf7">3</text><text x="925" y="150" fill="#4dabf7">4</text><text x="1075" y="150" fill="#4dabf7">5</text>
    <text x="325" y="330" fill="#6c5ce7">-6</text><text x="475" y="330" fill="#6c5ce7">-5</text><text x="625" y="330" fill="#6c5ce7">-4</text>
    <text x="775" y="330" fill="#6c5ce7">-3</text><text x="925" y="330" fill="#6c5ce7">-2</text><text x="1075" y="330" fill="#6c5ce7">-1</text>
  </g>
  <text x="210" y="150" class="mono" font-size="13" fill="#4dabf7" text-anchor="end">forward</text>
  <text x="210" y="330" class="mono" font-size="13" fill="#6c5ce7" text-anchor="end">backward</text>

  <!-- results -->
  <g class="mono" font-size="20">
    <g class="out"><rect x="250" y="380" width="420" height="96" rx="14" fill="#14161d" stroke="#d97757"/>
      <text x="274" y="418" fill="#8b8f9a" font-size="15">s[1:4]</text><text x="274" y="454" fill="#3ddc97" font-size="30" font-weight="700">"YTH"</text></g>
    <g>
      <rect x="700" y="380" width="200" height="96" rx="14" fill="#14161d" stroke="#2a2d36"/>
      <text x="720" y="418" fill="#8b8f9a" font-size="15">s[:4]</text><text x="720" y="454" fill="#f2e9e4" font-size="26">"PYTH"</text>
      <rect x="920" y="380" width="230" height="96" rx="14" fill="#14161d" stroke="#2a2d36"/>
      <text x="940" y="418" fill="#8b8f9a" font-size="15">s[::-1]</text><text x="940" y="454" fill="#f2e9e4" font-size="26">"NOHTYP"</text>
      <rect x="1170" y="380" width="260" height="96" rx="14" fill="#14161d" stroke="#ff4d8d" stroke-opacity=".7"/>
      <text x="1190" y="418" fill="#ff4d8d" font-size="15">s[0] = "J"</text><text x="1190" y="454" fill="#f2e9e4" font-size="22">TypeError</text>
    </g>
  </g>
  <text x="1170" y="500" class="sans" font-size="13" fill="#9a948f">Strings are immutable. Build a new string instead.</text>
</svg>
